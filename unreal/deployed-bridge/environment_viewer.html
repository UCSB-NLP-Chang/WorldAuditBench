<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>住宅环境</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#14191c;color:#eef0ed;font:15px system-ui,sans-serif}
main{max-width:1100px;margin:28px auto;padding:0 20px}header,.toolbar,.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header{justify-content:space-between;margin-bottom:22px}h1{font-size:23px;font-weight:550;margin:0}#status{color:#a8c8b7;font-size:13px}
select,button,input{font:inherit;border:1px solid #45504f;border-radius:8px;background:#252e30;color:inherit;padding:10px 14px}button{cursor:pointer}button:hover:enabled{background:#354443}button:disabled{opacity:.4;cursor:default}
.primary{background:#b7d3bf;color:#18231f;border-color:#b7d3bf}.toolbar{margin-bottom:16px}label{display:flex;align-items:center;gap:8px}label span{color:#b9c2be;font-size:13px}
.viewport{aspect-ratio:16/9;background:#090c0d;display:grid;place-items:center;border:1px solid #35413e;border-radius:10px;overflow:hidden}#frame{width:100%;height:100%;object-fit:contain;grid-area:1/1}#empty{color:#7d8c85;grid-area:1/1}.controls{justify-content:center;margin-top:18px}.group{display:flex;gap:6px}#error{color:#ffb7ac;min-height:24px;margin:12px 0;font-size:14px}input{width:95px}#retry{border-color:#cb997d}button:focus-visible,select:focus-visible{outline:2px solid #b7d3bf;outline-offset:3px}
@media(max-width:600px){main{padding:0 10px;margin-top:18px}.controls{gap:10px}select,button{padding:9px 11px}}
</style>
<main>
<header><h1>住宅环境</h1><span id="status" role="status">连接中</span></header>
<div class="toolbar">
<label><span>区域</span><select id="region" aria-label="区域"></select></label>
<label><span>任务</span><select id="task" aria-label="任务"></select></label>
<button id="enter" class="primary" disabled>进入环境</button>
</div>
<div class="viewport"><span id="empty">选择区域后进入</span><img id="frame" alt="当前环境画面" hidden></div>
<div class="controls">
<div class="group"><button data-action="move_up" aria-label="前进">前进</button><button data-action="move_down" aria-label="后退">后退</button></div>
<div class="group"><button data-action="turn" data-value="-30">左转</button><button data-action="turn" data-value="30">右转</button></div>
<div class="group"><button data-action="look" data-value="-15">抬头</button><button data-action="look" data-value="15">低头</button></div>
<button data-action="interact">交互</button><button data-action="idle">观察 1 秒</button>
</div>
<p id="error" role="alert"></p><button id="retry" hidden>重试刚才的操作</button>
</main>
<script>
const $=id=>document.getElementById(id), names={living_room:'客厅',kitchen_dining:'厨房与餐区',bedroom_suite:'卧室'};
let episode=sessionStorage.getItem('unreal-episode'), catalog=null, busy=false, pending=null, ready=false;
function refresh(){
  $('enter').disabled=!ready||busy||!!pending;
  $('region').disabled=$('task').disabled=busy||!!pending;
  document.querySelectorAll('[data-action]').forEach(b=>b.disabled=!episode||busy||!!pending);
  $('retry').hidden=!pending||busy;
}
function tasks(){
  $('task').replaceChildren(new Option('基础环境',$('region').value));
  catalog.tasks.filter(t=>t.region===$('region').value).forEach(t=>$('task').add(new Option(t.id,t.id)));
}
function show(state){
  episode=state.episode_id;sessionStorage.setItem('unreal-episode',episode);
  $('frame').src='data:image/png;base64,'+state.rgb.base64;
  $('frame').hidden=false;$('empty').hidden=true;$('status').textContent='已暂停';
}
async function request(path,body){
  const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const data=await response.json();
  if(!response.ok){const error=new Error(data.error||'请求失败');error.status=response.status;throw error;}
  return data;
}
async function execute(path,body){
  if(busy)return;
  pending={path,body};busy=true;$('error').textContent='';$('status').textContent='执行中';refresh();
  try{show(await request(path,body));pending=null;}
  catch(error){
    if(error.status){pending=null;$('error').textContent=error.status===409?'会话已变化，或环境正在被使用。请等待当前操作完成；重新连接后需再次进入环境。':error.message;}
    else{$('error').textContent='连接中断。恢复连接后请重试刚才的操作。';}
    $('status').textContent='操作未完成';
    if(error.status===409){
      try{const h=await (await fetch('/health')).json();if(!h.episode_started){episode=null;sessionStorage.removeItem('unreal-episode');}}
      catch(ignored){}
    }
  }finally{busy=false;refresh();}
}
$('region').onchange=tasks;
$('enter').onclick=()=>{const body={request_id:crypto.randomUUID(),task_id:$('task').value,seed:123};if(episode)body.episode_id=episode;execute('/reset',body);};
$('retry').onclick=()=>{if(pending)execute(pending.path,pending.body);};
document.querySelectorAll('[data-action]').forEach(button=>button.onclick=()=>{
  const action={name:button.dataset.action};
  if(action.name.startsWith('move_'))action.distance=50;
  if(['turn','look'].includes(action.name))action.degree=Number(button.dataset.value);
  if(action.name==='idle')action.time='1s';
  execute('/step',{episode_id:episode,request_id:crypto.randomUUID(),action});
});
async function init(){
  refresh();
  try{
    catalog=await (await fetch('/tasks')).json();
    catalog.baselines.forEach(id=>$('region').add(new Option(names[id]||id,id)));tasks();
    const health=await (await fetch('/health')).json();
    if(!health.engine_alive)throw new Error('环境进程尚未就绪，请稍后刷新。');
    ready=true;$('status').textContent='已连接';
    if(episode){
      try{const state=await request('/observe',{episode_id:episode});show(state);
        const match=catalog.tasks.find(t=>t.id===state.task_id), mapNames={LivingRoom:'living_room',KitchenDining:'kitchen_dining',BedroomSuite:'bedroom_suite'};
        $('region').value=match?match.region:mapNames[state.map];tasks();$('task').value=match?match.id:$('region').value;
      }catch(error){episode=null;sessionStorage.removeItem('unreal-episode');if(health.episode_started)$('error').textContent='环境已有其他会话，请使用原来的页面或客户端。';}
    }else if(health.episode_started){$('error').textContent='环境已有其他会话，请使用原来的页面或客户端。';}
  }catch(error){$('status').textContent='未连接';$('error').textContent=error.message;}
  refresh();
}
init();
</script>
</html>
