<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>human</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0f1115;
               color: #e6e6e6; font: 12px/1.6 ui-monospace, Menlo, monospace; }
  canvas { display: block; }
  #cross { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px;
           margin: -3px 0 0 -3px; border-radius: 50%;
           background: rgba(255,255,255,.85); box-shadow: 0 0 4px #000;
           display: none; pointer-events: none; z-index: 5; }
  #cross.on { display: block; }
  #hud { position: fixed; left: 50%; top: calc(50% + 22px); transform: translateX(-50%);
         text-align: center; display: none; pointer-events: none; z-index: 5;
         text-shadow: 0 1px 3px #000; }
  #hud.on { display: block; }
  #prompt { color: #7dffb4; font-size: 13px; min-height: 18px; }
  #corner { position: fixed; right: 14px; top: 12px; text-align: right;
            color: rgba(255,255,255,.5); display: none; pointer-events: none;
            text-shadow: 0 1px 3px #000; white-space: pre; z-index: 5; }
  #corner.on { display: block; }
  #keys { position: fixed; left: 14px; bottom: 12px; color: rgba(255,255,255,.35);
          display: none; pointer-events: none; text-shadow: 0 1px 3px #000; z-index: 5; }
  #keys.on { display: block; }
  #keys kbd { color: rgba(255,255,255,.7); }
  #toast { position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%);
           background: rgba(20,24,32,.92); border: 1px solid rgba(255,255,255,.15);
           padding: 7px 14px; border-radius: 6px; opacity: 0; transition: opacity .25s;
           pointer-events: none; z-index: 30; }
  #toast.on { opacity: 1; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 0;
          transition: opacity .3s; pointer-events: none; z-index: 40; }
  #bwarn { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); z-index: 45; display: grid; gap: 6px;
           min-width: min(520px, calc(100vw - 36px)); padding: 16px 26px; text-align: center; pointer-events: none;
           border: 1px solid rgba(255,82,82,.72); border-radius: 14px; background: rgba(52,4,8,.9); color: #fff4f4;
           font-family: Inter, system-ui, sans-serif; opacity: 0; transition: opacity .18s; }
  #bwarn.on { opacity: 1; }
  #bwarn strong { color: #ff5d62; font-size: clamp(22px, 3vw, 36px); font-weight: 850; letter-spacing: .05em; }
  #bwarn span { color: rgba(255,235,235,.84); font-size: 15px; font-weight: 650; letter-spacing: .06em; }
  #panel { position: fixed; inset: 0; display: grid; place-content: center;
           background: rgba(10,12,16,.9); backdrop-filter: blur(6px); z-index: 20;
           transition: opacity .25s; }
  #panel.hidden { opacity: 0; pointer-events: none; }
  html.noui #panel #title, html.noui #panel #desc, html.noui #panel .sec { display: none; }   /* noui: the menu is just a load status */
  #card { width: 520px; max-height: 88vh; overflow-y: auto;
          background: #14171d; border: 1px solid rgba(255,255,255,.1);
          border-radius: 10px; padding: 18px 20px; }
  #card h1 { margin: 0 0 4px; font-size: 15px; }
  .dim { color: rgba(255,255,255,.4); }
  .sec { margin-top: 14px; }
  button { width: 100%; padding: 8px 10px; font: inherit; cursor: pointer;
           background: rgba(255,255,255,.06); color: #e6e6e6;
           border: 1px solid rgba(255,255,255,.12); border-radius: 6px; }
  button:hover { background: rgba(255,255,255,.12); }
  button.primary { background: #3b82f6; border-color: #3b82f6; color: #fff;
                   font-weight: 600; padding: 10px; }
  .row { display: flex; gap: 8px; margin-top: 8px; }
  #answers { display: none; }
  #answers.on { display: block; }
  #answers ol { margin: 6px 0 0; padding-left: 20px; }
  #answers li { margin: 5px 0; color: #ffd166; }
  #answers li .dim { display: block; color: rgba(255,255,255,.45); }
  #status { margin-top: 10px; min-height: 16px; color: rgba(255,255,255,.4); }
  #status.err { color: #ff8a80; }
</style>
</head>
<body>

<div id="cross"></div>
<div id="hud"><div id="prompt"></div></div>
<div id="corner"></div>
<div id="toast"></div>
<div id="fade"></div>
<div id="bwarn"><strong>Edge of the explorable area</strong><span>Turn around and keep exploring inside</span></div>
<div id="keys">
  <kbd>WASD</kbd> move · <kbd>Shift</kbd> run · <kbd>Space</kbd> jump · <kbd>E</kbd> interact ·
  <kbd>F</kbd> fly · <kbd>R</kbd> respawn · <kbd>V</kbd> show invisible colliders · <kbd>Esc</kbd> menu
</div>

<div id="panel">
  <div id="card">
    <h1 id="title">…</h1>
    <div class="dim" id="desc"></div>
    <div class="sec">
      <div class="row">
        <button id="toggleAnswers" style="display:none">Show bug answers</button>
        <button id="export" style="display:none">Export answers JSON</button>
      </div>
      <div id="answers"><ol id="anslist"></ol></div>
    </div>
    <div class="row" style="margin-top:16px">
      <button class="primary" id="enter" disabled>Enter world</button>
    </div>
    <div id="status">Loading...</div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "/assets/vendor/three/three.module.js",
    "three/addons/": "/assets/vendor/three/addons/",
    "three-mesh-bvh": "/assets/vendor/three-mesh-bvh/index.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { initEnv } from './core.js';

const $ = id => document.getElementById(id);
const q = new URLSearchParams(location.search);
const name = q.get('config') || 'env3-buggy-world';
document.title = `human:${name}`;
// noui (the review site's clean view): no menu / HUD / key hints / answer beacons; the world is the whole view and a
// click on it takes the pointer.  The page-level overlays are hidden by the shared block (src/common/noui_block.html).
const noui = q.has('noui');
if (noui) document.documentElement.classList.add('noui');

let toastT;
const fx = {
  toast(m) { $('toast').textContent = m; $('toast').classList.add('on');
    clearTimeout(toastT); toastT = setTimeout(() => $('toast').classList.remove('on'), 2000); },
  fade() { $('fade').style.opacity = 1; setTimeout(() => $('fade').style.opacity = 0, 350); },
  prompt(t) { $('prompt').textContent = t; },
  hud(s) { $('corner').textContent =
    `Gems ${s.gems}\nx ${s.pos[0].toFixed(0)}  y ${s.pos[1].toFixed(1)}  z ${s.pos[2].toFixed(0)}` +
    (flyOn ? '\nflying' : ''); },
  progress(m) { $('status').textContent = m || 'Ready.'; },
  boundary() { $('bwarn').classList.add('on'); clearTimeout(bwarnT); bwarnT = setTimeout(() => $('bwarn').classList.remove('on'), 1500); },
};
let bwarnT;

let ctx = null, flyOn = false;
const helpers = new THREE.Group(); helpers.visible = false;
const beacons = new THREE.Group(); beacons.visible = false;
let helpersBuilt = false, answersData = null;

function buildHelpers() {
  if (!ctx) return;
  if (!helpersBuilt) {
    helpersBuilt = true;
    for (const e of ctx.extras)
      helpers.add(new THREE.Box3Helper(e.box, e.hcolor ?? 0x556677));
  }
  // beacons build separately: answers load async, so a V-press before the fetch resolves
  // must not latch them out (they are re-attempted on every toggle until built)
  if (beacons.children.length === 0 && answersData) for (const a of answersData) {
    const beam = new THREE.Mesh(
      new THREE.CylinderGeometry(.07, .07, 7, 8),
      new THREE.MeshBasicMaterial({ color: 0xffd166 }));
    const p = ctx.resolvePos(a.at);
    beam.position.copy(p); beam.position.y += 3.5;
    beacons.add(beam);
  }
}

const locked = () => document.pointerLockElement === document.body;

try {
  ctx = await initEnv({ configUrl: `./configs/${name}.json`, agentMode: false, fx });
  window.__ctx = ctx; window.__THREE = THREE;   // tooling: scene inspection from Playwright (layout dumps, audits)
  ctx.scene.add(helpers, beacons);
  $('title').textContent = ctx.config.meta?.title || name;
  $('desc').textContent = ctx.config.meta?.desc || '';
  $('enter').disabled = false;
  if (noui) $('panel').classList.add('hidden');
  $('status').textContent =
    `Ready: ${ctx.worldMeshes.length} static meshes, ${(ctx.config.bugs || []).length} planted bugs, ${ctx.totalGems} gems.`;

  // answers live in a separate file that agent.html never loads
  fetch(`./configs/${name}.answers.json`).then(r => r.ok ? r.json() : null).then(d => {
    if (!d) return;
    answersData = d;
    $('toggleAnswers').style.display = '';
    $('export').style.display = '';
    const ol = $('anslist');
    d.forEach(a => {
      const li = document.createElement('li');
      li.innerHTML = `${a.name}<span class="dim">${a.where}</span>`;
      ol.appendChild(li);
    });
  }).catch(() => {});
  // used by eval/score_flags.py: resolve answers' at-specs into world coordinates (human entry only)
  window.__resolveAnswers = list => list.map(a => ({
    ...a, position: ctx.resolvePos(a.at).toArray().map(v => +v.toFixed(2)),
  }));
} catch (err) {
  console.error(err);
  $('status').className = 'err';
  $('status').textContent = 'Load failed: ' + err;
  window.__initError = String(err && err.stack || err);
}

$('toggleAnswers').onclick = () => {
  buildHelpers();
  const on = $('answers').classList.toggle('on');
  beacons.visible = on; helpers.visible = on;
  $('toggleAnswers').textContent = on ? 'Hide bug answers' : 'Show bug answers';
};
$('export').onclick = () => {
  if (!answersData) return;
  const data = answersData.map(a => ({
    name: a.name, where: a.where,
    position: ctx.resolvePos(a.at).toArray().map(v => +v.toFixed(2)),
  }));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
  a.download = `${name}.answers.resolved.json`;
  a.click();
};
$('enter').onclick = () => { if (ctx) document.body.requestPointerLock(); };
document.body.addEventListener('click', () => { if (noui && ctx && !locked()) document.body.requestPointerLock(); });

document.addEventListener('pointerlockchange', () => {
  const on = locked();
  $('panel').classList.toggle('hidden', on || noui);
  for (const id of ['cross', 'hud', 'corner', 'keys']) $(id).classList.toggle('on', on);
});
document.body.addEventListener('mousemove', e => {
  if (!locked() || !ctx) return;
  ctx.camera.rotation.y -= e.movementX / 600;
  ctx.camera.rotation.x -= e.movementY / 600;
  ctx.camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, ctx.camera.rotation.x));
});
addEventListener('keydown', e => {
  if (!ctx) return;
  ctx.keys[e.code] = true;
  if (!locked()) return;
  if (e.code === 'KeyF') { flyOn = !flyOn; ctx.setFlying(flyOn); fx.toast(flyOn ? 'Flying (no collision)' : 'Walking'); }
  if (e.code === 'KeyR') ctx.respawn();
  if (e.code === 'KeyV' && !noui) {
    buildHelpers();
    helpers.visible = !helpers.visible; beacons.visible = helpers.visible;
    fx.toast(helpers.visible ? 'Invisible colliders shown' : 'Invisible colliders hidden');
  }
  if (e.code === 'KeyE') ctx.useAimed();
});
addEventListener('keyup', e => { if (ctx) ctx.keys[e.code] = false; });
</script>
</body>
</html>
