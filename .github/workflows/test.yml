name: Source tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_release.py
      - run: python -m pytest -q -m 'not chromium and not live'
      - name: Explore service contracts
        working-directory: services/explore
        run: PYTHONPATH=. python -m unittest discover -s tests
