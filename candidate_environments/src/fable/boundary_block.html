<style id="benchmark-boundary-style">
  #benchmark-boundary-warning{position:fixed;left:50%;top:50%;z-index:2147483647;display:grid;gap:7px;min-width:min(560px,calc(100vw - 36px));max-width:calc(100vw - 36px);padding:17px 26px 16px;transform:translate(-50%,-50%) scale(.97);border:1px solid rgba(255,82,82,.72);border-radius:14px;background:rgba(52,4,8,.9);box-shadow:0 18px 60px rgba(0,0,0,.48),0 0 34px rgba(255,42,42,.2);color:#fff4f4;text-align:center;font-family:Inter,"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .18s ease,transform .18s ease,visibility 0s linear .18s}
  #benchmark-boundary-warning.is-visible{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1);transition-delay:0s}
  #benchmark-boundary-warning strong{color:#ff5d62;font-size:clamp(24px,3vw,40px);font-weight:850;line-height:1.1;letter-spacing:.05em;text-shadow:0 2px 16px rgba(255,22,35,.42)}
  #benchmark-boundary-warning span{color:rgba(255,235,235,.84);font-size:clamp(13px,1.25vw,17px);font-weight:650;letter-spacing:.06em}

<div id="benchmark-boundary-warning" role="status" aria-live="assertive" aria-atomic="true"><strong>Edge of the explorable area</strong><span>Turn around and keep exploring inside the scene</span></div>
<div id="benchmark-boundary-badge">Constrained area · WASD boundary</div>
<script id="benchmark-boundary-script">
(() => {
  'use strict';
  const config = {"id":"13_beyond_fable_wilderness_constrained","title":"Beyond Fable Wilderness","kind":"benchmark","halfX":110,"halfZ":110,"center":null,"warningMs":1500,"touchEpsilon":0.025,"releaseMargin":0.45,"keyboardMove":false,"keyboardSpeed":0};
  const warning = document.getElementById('benchmark-boundary-warning');
  const keys = new Set();
  let adapter = null;
  let center = config.center ? {x:config.center[0],y:config.center[1],z:config.center[2]} : null;
  let inContact = false;
  let hideTimer = 0;
  let lastFrame = performance.now();

  addEventListener('keydown', event => { if (/^Key[WASD]$/.test(event.code)) keys.add(event.code); }, true);
  addEventListener('keyup', event => { keys.delete(event.code); }, true);
  addEventListener('blur', () => keys.clear());

  const copy = p => ({x:Number(p.x)||0,y:Number(p.y)||0,z:Number(p.z)||0});
  const vectorAdapter = (getVector, afterSet) => ({
    get(){ const p=getVector(); return p ? copy(p) : null; },
    set(next){ const p=getVector(); if(!p)return; if(typeof p.set==='function')p.set(next.x,next.y,next.z);else{p.x=next.x;p.y=next.y;p.z=next.z;} afterSet?.(next); }
  });

  function resolveSketchbook(){
    const world=window.sketchbookWorld;
    if(!world)return null;
    const entity=()=>{
      let item=world.inputManager?.inputReceiver;
      item=item?.controlledObject||item;
      if(item?.characterCapsule||item?.rayCastVehicle||item?.position)return item;
      return world.characters?.[0]||world.vehicles?.[0]||null;
    };
    const bodyOf=item=>item?.characterCapsule?.body||item?.rayCastVehicle?.chassisBody||item?.collision||null;
    return {
      get(){const item=entity(),body=bodyOf(item),p=body?.position||item?.position;return p?copy(p):null;},
      set(next){
        const item=entity(),body=bodyOf(item);if(!item)return;
        if(typeof item.setPosition==='function')item.setPosition(next.x,next.y,next.z);
        if(body?.position){body.position.x=next.x;body.position.y=next.y;body.position.z=next.z;}
        for(const name of ['previousPosition','interpolatedPosition'])if(body?.[name]){body[name].x=next.x;body[name].y=next.y;body[name].z=next.z;}
        if(item.position?.set)item.position.set(next.x,next.y,next.z);
        if(body?.velocity){body.velocity.x=0;body.velocity.z=0;}
      }
    };
  }

  function resolveRigidBody(getBody){
    return {
      get(){const body=getBody();if(!body||typeof body.translation!=='function')return null;return copy(body.translation());},
      set(next){const body=getBody();if(!body)return;if(typeof body.setTranslation==='function')body.setTranslation(next,true);const velocity=body.linvel?.();if(velocity&&body.setLinvel)body.setLinvel({x:0,y:velocity.y,z:0},true);}
    };
  }

  function resolveAdapter(){
    if(config.kind==='cottage')return resolveRigidBody(()=>window.experience?.world?.player?.rigidBody);
    if(config.kind==='orb')return resolveRigidBody(()=>window.__orbKnightRigidBody);
    if(config.kind==='sketchbook')return resolveSketchbook();
    const world=window.BenchmarkWorld;
    if(!world)return null;
    if(config.kind==='thalassia'){
      const boat=world.environment?.boat;
      if(!boat)return null;
      return {
        get(){return copy(boat.position||boat.group?.position);},
        set(next){if(boat.position?.set)boat.position.set(next.x,next.y,next.z);if(boat.group?.position?.set)boat.group.position.set(next.x,next.y,next.z);if('speed'in boat)boat.speed=0;}
      };
    }
    if(config.kind==='forge')return vectorAdapter(()=>world.player,()=>world.boundaryRefresh?.());
    if(config.kind==='minecraft')return vectorAdapter(()=>world.camera?.position||world.player?.position);
    if(world.player?.getState&&world.player?.setPosition)return {get(){const p=world.player.getState()?.position;return p?{x:p[0],y:p[1],z:p[2]}:null;},set(next){world.player.setPosition([next.x,next.y,next.z]);}};
    if(world.player?.position)return vectorAdapter(()=>world.player.position);
    if(world.actor?.camera?.position)return vectorAdapter(()=>world.actor.camera.position);
    if(world.actor?.position)return vectorAdapter(()=>world.actor.position);
    if(world.camera?.position)return vectorAdapter(()=>world.camera.position);
    return null;
  }

  function showWarning(){
    warning.classList.add('is-visible');
    clearTimeout(hideTimer);
    hideTimer=setTimeout(()=>warning.classList.remove('is-visible'),config.warningMs);
  }

  function isMoving(){return keys.size>0;}
  function step(now){
    requestAnimationFrame(step);
    if(!adapter)adapter=resolveAdapter();
    if(!adapter)return;
    let p=adapter.get();
    if(!p)return;
    if(!center)center=copy(p);
    const dt=Math.min(.05,Math.max(0,(now-lastFrame)/1000));lastFrame=now;
    if(config.keyboardMove&&isMoving()){
      let dx=(keys.has('KeyD')?1:0)-(keys.has('KeyA')?1:0),dz=(keys.has('KeyS')?1:0)-(keys.has('KeyW')?1:0),len=Math.hypot(dx,dz)||1;
      p.x+=dx/len*config.keyboardSpeed*dt;p.z+=dz/len*config.keyboardSpeed*dt;adapter.set(p);
    }
    const minX=center.x-config.halfX,maxX=center.x+config.halfX,minZ=center.z-config.halfZ,maxZ=center.z+config.halfZ;
    const outside=p.x<minX||p.x>maxX||p.z<minZ||p.z>maxZ;
    const touching=isMoving()&&(p.x<=minX+config.touchEpsilon||p.x>=maxX-config.touchEpsilon||p.z<=minZ+config.touchEpsilon||p.z>=maxZ-config.touchEpsilon);
    const hit=outside||touching;
    if(outside){p.x=Math.max(minX,Math.min(maxX,p.x));p.z=Math.max(minZ,Math.min(maxZ,p.z));adapter.set(p);}
    if(hit&&!inContact){inContact=true;showWarning();}
    if(!isMoving()||(!hit&&p.x>minX+config.releaseMargin&&p.x<maxX-config.releaseMargin&&p.z>minZ+config.releaseMargin&&p.z<maxZ-config.releaseMargin))inContact=false;
  }

  window.BenchmarkBoundary={
    version:1,config,
    get center(){return center&&{...center};},
    get bounds(){return center&&{minX:center.x-config.halfX,maxX:center.x+config.halfX,minZ:center.z-config.halfZ,maxZ:center.z+config.halfZ};},
    getPosition(){return adapter?.get()||null;},
    showWarning,
    checkNow(){const p=adapter?.get();if(!p||!center)return false;const b=this.bounds;const hit=p.x<b.minX||p.x>b.maxX||p.z<b.minZ||p.z>b.maxZ;if(hit){p.x=Math.max(b.minX,Math.min(b.maxX,p.x));p.z=Math.max(b.minZ,Math.min(b.maxZ,p.z));adapter.set(p);showWarning();}return hit;}
  };
  requestAnimationFrame(step);
})();
</script>
