<!-- noui-block: the review site's clean view (?noui=1).  Reviewers see what the agent's observation frames contain:
     the WebGL canvas plus the transient "edge of the explorable area" notice (the harness composites that notice
     into the agent's frames too).  Every other page overlay (menus, HUDs, key hints, debug panels, badges, DOM-only
     tints) is hidden, and keys outside the agent's action space (move / turn / look / interact) are swallowed before
     the page sees them.  Injected into every environment page by the build scripts through src/common/noui.py,
     which fills the per-family key list below. -->
<style id="noui-style">
html.noui #cross, html.noui #hud, html.noui #corner, html.noui #keys, html.noui #toast, html.noui #fade, html.noui #answers,  /* sponza / house (env/human.html) */
html.noui .clean-dive-ui, html.noui .vignette,                                                                            /* reef */
html.noui .cycles-overlay, html.noui .credits-overlay, html.noui .controls-overlay,                                          /* cottage */
html.noui #ui-container, html.noui #dat-gui-container, html.noui .dg, html.noui #statsBox, html.noui #offline-status,        /* airfield */
html.noui #hack-menu, html.noui #start-overlay, html.noui #underwater-overlay,                                              /* wilderness (all inside #hud) */
html.noui #benchmark-boundary-badge, html.noui #bug-picker { display: none !important; }
</style>
<script id="noui-script">
(function () {
  var q; try { q = new URLSearchParams(location.search); } catch (e) { return; }
  if (!q.has('noui')) return;
  document.documentElement.classList.add('noui');
  var BLOCK = __NOUI_KEYS__;   // key codes outside the agent's action space for this family
  function swallow(e) { if (BLOCK.indexOf(e.code) >= 0) { e.stopImmediatePropagation(); e.preventDefault(); } }
  window.addEventListener('keydown', swallow, true);
  window.addEventListener('keyup', swallow, true);
  window.__noui = { keysBlocked: BLOCK };
})();
</script>
