<script>
(async () => {
  'use strict';
  const P = window.__PACK;
  const bytes = s => fetch('data:application/octet-stream;base64,' + s).then(r => r.arrayBuffer());
  const gunzip = buf => new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
  const text = async s => new TextDecoder().decode(await gunzip(await bytes(s)));
  // ---- embedded assets -> blob URLs
  const assetUrls = {};
  const normalise = p => String(p).replace(/^\.\//, '').replace(/^\//, '').replace(/[?#].*$/, '');
  window.__resolveAsset = (path) => {
    const key = normalise(path);
    if (assetUrls[key]) return assetUrls[key];
    const a = P.assets[key];
    if (!a) return path;
    const bin = atob(a.d);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    assetUrls[key] = URL.createObjectURL(new Blob([arr], { type: a.t }));
    return assetUrls[key];
  };
  // fetch/XHR override so loaders that compose their own paths (DRACO decoder) find the assets
  const nativeFetch = window.fetch.bind(window);
  const resolveRequest = (input) => {
    const value = normalise(String(input && input.url || input));
    for (const key of Object.keys(P.assets)) if (value === key || value.endsWith('/' + key)) return window.__resolveAsset(key);
    return null;
  };
  window.fetch = (resource, init) => nativeFetch(resolveRequest(resource) || resource, init);
  const nativeOpen = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function (method, url, ...rest) { return nativeOpen.call(this, method, resolveRequest(url) || url, ...rest); };
  // ---- ES modules -> blob URLs referenced through a dynamically injected import map, so the
  // upstream's circular imports (singleton pattern) resolve like they would on a real server.
  const known = new Set(P.order);
  const resolve = (spec, fromPath) => {
    if (P.aliases[spec]) return P.aliases[spec];
    if (spec.startsWith('three/examples/jsm/')) return 'vendor/addons/' + spec.slice(19);
    if (spec.startsWith('three/addons/')) return 'vendor/addons/' + spec.slice(13);
    if (spec.startsWith('.')) {
      const parts = fromPath.split('/'); parts.pop();
      for (const seg of spec.split('/')) { if (seg === '.') continue; if (seg === '..') parts.pop(); else parts.push(seg); }
      const path = parts.join('/');
      for (const c of [path, path + '.js', path + '/index.js']) if (known.has(c)) return c;
      return path;
    }
    return spec;
  };
  const RE = /(from\s*|import\s*\(\s*|^\s*import\s+)(['"])([^'"]+)\2/gm;
  try {
    const imports = {};
    for (const path of P.order) {
      const src = (await text(P.js[path])).replace(RE, (m, pre, q, spec) => {
        const target = resolve(spec, path);
        return known.has(target) ? pre + q + 'm:' + target + q : m;
      });
      imports['m:' + path] = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
    }
    const map = document.createElement('script');
    map.type = 'importmap';
    map.textContent = JSON.stringify({ imports });
    document.head.appendChild(map);
    await import('m:' + P.entry);
  } catch (err) {
    console.error(err);
    window.__initError = String(err && err.stack || err);
  }
})();
</script>

<div id="benchmark-boundary-warning" role="status" aria-live="assertive" aria-atomic="true"><strong>Edge of the explorable area</strong><span>Turn around and keep exploring inside the scene</span></div>
<div id="benchmark-boundary-badge">Constrained area · WASD boundary</div>
<script id="benchmark-boundary-script">
(() => {
  'use strict';
  const config = {"id":"01_mistwood_cottage_constrained","title":"Mistwood Cottage","kind":"cottage","halfX":25,"halfZ":25,"center":null,"warningMs":1500,"touchEpsilon":0.025,"releaseMargin":0.45,"keyboardMove":false,"keyboardSpeed":0};
  const warning = document.getElementById('benchmark-boundary-warning');
  const keys = new Set();
  let adapter = null;
  let center = config.center ? {x:config.center[0],y:config.center[1],z:config.center[2]} : null;
  let inContact = false;
  let hideTimer = 0;
  addEventListener('keydown', event => { if (/^Key[WASD]$/.test(event.code)) keys.add(event.code); }, true);
  addEventListener('keyup', event => { keys.delete(event.code); }, true);
  addEventListener('blur', () => keys.clear());
  const copy = p => ({x:Number(p.x)||0,y:Number(p.y)||0,z:Number(p.z)||0});
  function resolveRigidBody(getBody){
    return {
      get(){const body=getBody();if(!body||typeof body.translation!=='function')return null;return copy(body.translation());},
      set(next){const body=getBody();if(!body)return;if(typeof body.setTranslation==='function')body.setTranslation(next,true);if(typeof body.setNextKinematicTranslation==='function')body.setNextKinematicTranslation(next);}
    };
  }
  function resolveAdapter(){ return resolveRigidBody(()=>window.experience?.world?.player?.rigidBody); }
  function showWarning(){ warning.classList.add('is-visible'); clearTimeout(hideTimer); hideTimer=setTimeout(()=>warning.classList.remove('is-visible'),config.warningMs); }
  function isMoving(){return keys.size>0;}
  function step(){
    requestAnimationFrame(step);
    if(!adapter)adapter=resolveAdapter();
    if(!adapter)return;
    let p=adapter.get();
    if(!p)return;
    if(!center)center=copy(p);
    const minX=center.x-config.halfX,maxX=center.x+config.halfX,minZ=center.z-config.halfZ,maxZ=center.z+config.halfZ;
    const outside=p.x<minX||p.x>maxX||p.z<minZ||p.z>maxZ;
    const touching=isMoving()&&(p.x<=minX+config.touchEpsilon||p.x>=maxX-config.touchEpsilon||p.z<=minZ+config.touchEpsilon||p.z>=maxZ-config.touchEpsilon);
    const hit=outside||touching;
    if(outside){p.x=Math.max(minX,Math.min(maxX,p.x));p.z=Math.max(minZ,Math.min(maxZ,p.z));adapter.set(p);}
    if(hit&&!inContact){inContact=true;showWarning();}
    if(!isMoving()||(!hit&&p.x>minX+config.releaseMargin&&p.x<maxX-config.releaseMargin&&p.z>minZ+config.releaseMargin&&p.z<maxZ-config.releaseMargin))inContact=false;
  }
  window.BenchmarkBoundary={
    version:1,config,
    get center(){return center&&{...center};},
    get bounds(){return center&&{minX:center.x-config.halfX,maxX:center.x+config.halfX,minZ:center.z-config.halfZ,maxZ:center.z+config.halfZ};},
    getPosition(){return adapter?.get()||null;},
    showWarning,
    checkNow(){const p=adapter?.get();if(!p||!center)return false;const b=this.bounds;const hit=p.x<b.minX||p.x>b.maxX||p.z<b.minZ||p.z>b.maxZ;if(hit){p.x=Math.max(b.minX,Math.min(b.maxX,p.x));p.z=Math.max(b.minZ,Math.min(b.maxZ,p.z));adapter.set(p);showWarning();}return hit;}
  };
  requestAnimationFrame(step);
})();
</script>
