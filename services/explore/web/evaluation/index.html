<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人工评测 · Bug Finding</title><link rel="stylesheet" href="/static/style.css"><script type="module" src="/static/app.js?v=icl-boxes-v23"></script><link rel="stylesheet" href="/static/example.css?v=icl-boxes-v23"></head><body class="evaluation at-login">
<header class="topbar"><div class="brand"><span class="mark" aria-hidden="true">◈</span><div><h1>3D Interactive World Evaluator</h1></div></div><div id="account" class="account" hidden><span id="identity"></span><button id="logout" class="quiet">退出</button></div></header><div id="message" role="status" aria-live="polite"></div><main>
<section id="login" class="card login"><h2>3D Interactive<br>World Evaluator</h2><form id="login-form"><label>Name · 姓名<select id="login-name" autocomplete="username" required disabled><option value="">正在加载用户…</option></select></label><label>Passcode · 访问密码<input id="login-password" type="password" autocomplete="current-password" required></label><button id="login-submit" class="primary">进入复核</button></form></section>
<section id="workspace" hidden><details class="card review-guide"><summary>复核指南 · Review guide</summary><div class="section-head"><h3>判断依据与 bug taxonomy</h3><div class="guide-languages"><button id="review-zh" type="button">中文</button><button id="review-en" type="button">English</button></div></div><div id="review-instructions"></div><div id="review-taxonomy"></div></details><div class="queue-head"><div><span class="eyebrow">REVIEW QUEUE</span><h2>待评答案</h2></div><div class="toolbar-buttons"><button id="refresh">刷新队列</button><button id="claim" class="primary">领取下一份</button></div></div><div id="queue" class="queue"></div><div id="evaluation" hidden><div class="evaluation-grid"><aside class="card reference"><span class="eyebrow">TASK CONTEXT</span><h2>任务与参考标准</h2><h3>Query</h3><p id="query"></p><div class="rubric"><h3>Ground-truth rubric · 条目 1</h3><pre id="rubric"></pre></div><p class="muted">自由探索可能发现参考标准之外的真实缺陷。参考标准之外的异常有充分证据时选“疑似额外真实 bug”；缺少足够证据时选“证据不足”。类别选错不等于 bug 不成立。</p><section id="task-example" class="icl-example" aria-label="参考例子"></section><details><summary>版本信息</summary><div id="version" class="mono"></div></details></aside><section><div class="section-head"><h2>探索者的答案</h2><span id="review-status" class="badge"></span></div><p class="muted" id="submission-id"></p><p id="exploration-protocol" class="muted"></p><div id="answers"></div><div class="card finish-row"><span id="history" class="muted"></span><button id="save" class="primary">保存人工判定</button></div></section></div></div></section>
</main><dialog id="preview"><img id="preview-image" alt="证据截图原图"><button id="preview-close">关闭</button></dialog></body></html>
