<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WorldAuditBench · Task viewer</title>
<style>
:root{font:14px/1.5 system-ui,sans-serif;color:#20272e;background:#f5f6f8;--line:#e0e4e8;--accent:#225ac8}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}header{height:66px;background:white;border-bottom:1px solid var(--line);padding:0 26px;display:flex;align-items:center;justify-content:space-between}header strong{font-size:19px;letter-spacing:-.4px}header span{color:#65717d;margin-left:14px}header a{color:#506070;text-decoration:none;margin-left:20px}.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 66px)}aside{background:white;border-right:1px solid var(--line);padding:22px 16px}.filter{display:block;color:#67737e;font-size:12px;font-weight:600;margin-bottom:12px}.filter select,.filter input{display:block;width:100%;margin-top:5px;padding:9px;border:1px solid #d7dde2;border-radius:6px;background:white;color:#24303a;font-size:13px}.count{font-size:12px;color:#73808b;margin:20px 2px 8px}.tasks{max-height:calc(100vh - 420px);overflow:auto;min-height:200px}.task{display:flex;align-items:center;justify-content:space-between;text-align:left;width:100%;border:0;border-radius:6px;background:transparent;padding:10px;color:#33404b}.task small{color:#74808c}.task:hover{background:#f1f4f8}.task.active{background:#eaf0fd;color:#174aaf;font-weight:650}.task.active small{color:#3566ba}main{padding:26px 30px;min-width:0}.heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:15px}h1{font-size:27px;letter-spacing:-.6px;margin:0}.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}.tag{font-size:12px;color:#566675;border:1px solid #d9e0e6;background:white;padding:3px 8px;border-radius:5px}.primary{background:var(--accent);color:white;border:0;border-radius:7px;padding:11px 18px;font-weight:600}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start}.card{background:white;border:1px solid var(--line);border-radius:9px;overflow:hidden}.viewport{position:relative;aspect-ratio:16/9;background:#e9edf1;display:grid;place-items:center}.placeholder{text-align:center;color:#75818c;padding:25px}.placeholder strong{display:block;font-size:16px;color:#4a5966;margin-bottom:7px}.viewport iframe,.viewport img{position:absolute;inset:0;border:0;width:100%;height:100%;object-fit:contain}.controls{padding:15px;display:flex;flex-wrap:wrap;gap:7px;justify-content:center}.controls button{border:1px solid #d9dfe6;background:white;border-radius:5px;padding:7px 11px;color:#364656}.controls button:hover{background:#eff3f9}.status{padding:0 18px 16px;font-size:12px;color:#6a7885;min-height:25px}.error{color:#ad3434!important}.detail{padding:19px 20px}.detail+.detail{border-top:1px solid var(--line)}h2{margin:0 0 14px;font-size:15px}h3{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:#7a8690;margin:17px 0 6px}h3:first-of-type{margin-top:0}.text{white-space:pre-wrap;margin:0;font-size:13px;line-height:1.65;overflow-wrap:anywhere}.map{font:11px/1.7 ui-monospace,monospace;color:#73808a}.hint{font-size:12px;color:#7e8993;margin-top:13px}[hidden]{display:none!important}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #739cef;outline-offset:2px}@media(max-width:1180px){.workspace{grid-template-columns:1fr}.details{display:grid;grid-template-columns:1fr 1fr}.detail+.detail{border-top:0;border-left:1px solid var(--line)}}@media(max-width:720px){header{padding:0 16px}header span,header nav{display:none}.app{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:10px}.filter{margin:0}.count{grid-column:1/-1;margin:4px}.tasks{grid-column:1/-1;max-height:145px;min-height:0}main{padding:20px 16px}.details{grid-template-columns:1fr}.detail+.detail{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<header><div><strong>WorldAuditBench</strong><span>Task viewer</span></div><nav><a href="https://arxiv.org/pdf/2609.40325" target="_blank" rel="noreferrer">Paper</a><a href="https://huggingface.co/datasets/ziyjiang/WorldAuditBench" target="_blank" rel="noreferrer">Dataset</a></nav></header>
<div class="app">
<aside aria-label="Task filters">
<label class="filter">Search<input id="search" placeholder="Task ID or environment" type="search"></label>
<label class="filter">Environment<select id="environment"><option value="">All environments</option></select></label>
<label class="filter">Taxonomy<select id="category"><option value="">All categories</option></select></label>
<label class="filter">Subcategory<select id="subcategory"><option value="">All subcategories</option></select></label>
<div class="count" id="count">Loading tasks…</div><div class="tasks" id="tasks" aria-label="Tasks"></div>
</aside>
<main>
<div class="heading"><div><h1 id="title">Select a task</h1><div class="tags" id="tags"></div></div><button class="primary" id="open" disabled>Open environment</button></div>
<div class="workspace"><div>
<div class="card"><div class="viewport"><div class="placeholder" id="placeholder"><strong>Interactive environment</strong>Choose a task, then open its environment.</div><iframe id="browser" title="Interactive Three.js environment" allow="fullscreen" hidden></iframe><img id="frame" alt="Unreal environment view" hidden></div>
<div class="controls" id="controls" hidden><button data-action="move_up">W · Forward</button><button data-action="move_down">S · Back</button><button data-action="turn" data-value="-30">A · Left</button><button data-action="turn" data-value="30">D · Right</button><button data-action="look" data-value="-15">↑ · Look up</button><button data-action="look" data-value="15">↓ · Look down</button><button data-action="interact">E · Interact</button><button data-action="idle">Wait 1s</button></div><div class="status" id="status" role="status"></div></div>
<p class="hint" id="map"></p></div>
<div class="card details"><section class="detail"><h2>Input prompt</h2><h3>Instruction</h3><p class="text" id="instruction">—</p><h3>Scene description</h3><p class="text" id="scene">—</p></section><section class="detail"><h2>Rubric</h2><h3>Anomaly</h3><p class="text" id="anomaly">—</p><h3>Expected</h3><p class="text" id="expected">—</p></section></div>
</div>
</main></div>
<script>
const $=id=>document.getElementById(id);let rows=[],selected=null,active=null,episode=null,busy=false;
function status(text,error=false){$('status').textContent=text;$('status').classList.toggle('error',error)}
function setBusy(value){busy=value;$('open').disabled=value||!selected;document.querySelectorAll('[data-action]').forEach(b=>b.disabled=value||!episode)}
function label(value){return value.replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase())}
function options(id,values){const select=$(id),old=select.value;while(select.options.length>1)select.remove(1);[...new Set(values)].sort().forEach(v=>select.add(new Option(id==='environment'?label(v):v,v)));if([...select.options].some(o=>o.value===old))select.value=old}
function selectTask(row){selected=row;$('title').textContent=row.task_id;$('tags').replaceChildren();[label(row.environment),row.engine,row.category,row.subcategory].forEach(text=>{const span=document.createElement('span');span.className='tag';span.textContent=text;$('tags').append(span)});$('instruction').textContent=row.input.instruction;$('scene').textContent=row.input.scene_description;$('anomaly').textContent=row.rubric.anomaly;$('expected').textContent=row.rubric.expected;$('map').textContent=row.map||'';$('open').textContent=active===row.task_id?'Restart environment':'Open environment';setBusy(busy);document.querySelectorAll('.task').forEach(b=>b.classList.toggle('active',b.dataset.task===row.task_id));history.replaceState(null,'','?task='+encodeURIComponent(row.task_id));if(active&&active!==row.task_id)status('Viewing '+active+'. Open '+row.task_id+' to switch environments.');}
function filter(){const cat=$('category').value;options('subcategory',rows.filter(r=>!cat||r.category===cat).map(r=>r.subcategory));const query=$('search').value.trim().toLowerCase(),env=$('environment').value,sub=$('subcategory').value;const shown=rows.filter(r=>(!env||r.environment===env)&&(!cat||r.category===cat)&&(!sub||r.subcategory===sub)&&(!query||(r.task_id+' '+r.environment).toLowerCase().includes(query)));$('count').textContent=shown.length+' / '+rows.length+' tasks';$('tasks').replaceChildren();shown.forEach(row=>{const button=document.createElement('button');button.className='task';button.dataset.task=row.task_id;const name=document.createElement('span');name.textContent=row.task_id;const type=document.createElement('small');type.textContent=row.subcategory;button.append(name,type);button.onclick=()=>selectTask(row);$('tasks').append(button)});if(shown.length){selectTask(shown.find(r=>r.task_id===selected?.task_id)||shown[0]);}else{selected=null;$('title').textContent='No matching tasks';$('tags').replaceChildren();for(const id of ['instruction','scene','anomaly','expected','map'])$(id).textContent='';setBusy(busy)}}
async function post(path,body){const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await response.json();if(!response.ok)throw Error(data.error||'Request failed');return data}
function showFrame(data){episode=data.episode_id;$('frame').src='data:image/png;base64,'+data.rgb.base64;$('frame').hidden=false;$('placeholder').hidden=true;status('Use the controls or W / A / S / D, arrow keys and E to explore.');}
$('open').onclick=async()=>{if(busy||!selected)return;const task=selected.task_id;setBusy(true);status('Opening '+task+'… The first download or startup may take a few minutes.');try{const result=await post('/api/open',{task_id:task});episode=null;active=task;$('browser').hidden=true;$('browser').src='about:blank';$('frame').hidden=true;$('controls').hidden=true;$('placeholder').hidden=true;if(result.engine==='threejs'){$('browser').src=result.url;$('browser').hidden=false;status('Click inside the environment to explore. Press Esc to release the mouse.')}else{$('controls').hidden=false;showFrame(await post('/api/reset',{task_id:task,seed:0,request_id:crypto.randomUUID()}))}$('open').textContent='Restart environment'}catch(error){episode=null;active=null;status(error.message,true)}finally{setBusy(false)}};
async function act(button){if(busy||!episode)return;const action={name:button.dataset.action};if(action.name.startsWith('move_'))action.distance=100;if(['turn','look'].includes(action.name))action.degree=Number(button.dataset.value);if(action.name==='idle')action.time='1s';setBusy(true);try{showFrame(await post('/api/step',{episode_id:episode,request_id:crypto.randomUUID(),action}))}catch(error){status(error.message,true)}finally{setBusy(false)}}
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(b));document.addEventListener('keydown',event=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)||!episode)return;const keys={w:0,s:1,a:2,d:3,ArrowUp:4,ArrowDown:5,e:6};if(event.key in keys){event.preventDefault();act(document.querySelectorAll('[data-action]')[keys[event.key]])}});
for(const id of ['environment','category','subcategory'])$(id).onchange=filter;$('search').oninput=filter;
(async()=>{try{const response=await fetch('/api/tasks');if(!response.ok)throw Error('Could not load task data');rows=await response.json();options('environment',rows.map(r=>r.environment));options('category',rows.map(r=>r.category));selected=rows.find(r=>r.task_id===new URLSearchParams(location.search).get('task'));filter()}catch(error){$('count').textContent='Task data unavailable';status(error.message,true)}})();
</script></body></html>
